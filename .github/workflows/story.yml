name: Klein story paylaşımı

on:
  schedule:
    # 07:50 UTC = 10:50 İstanbul → Klein Phönix (haftalar/). Story ~11:00'de düşer (Pazar plan boş: sadece istatistik toplanır).
    - cron: "50 7 * * *"
    # 09:50 UTC = 12:50 İstanbul (Pzt–Cmt) → Kastel (kastel/haftalar/). Story ~13:00'te düşer.
    - cron: "50 9 * * 1-6"
    # 11:50 UTC = 14:50 İstanbul (Pzt–Cmt) → Izaka (izaka/haftalar/). Story ~15:00'te düşer.
    - cron: "50 11 * * 1-6"
    # 13:50 UTC = 16:50 İstanbul (Pzt–Cmt) → ARTI2 (arti2/haftalar/). Story ~17:00'de düşer.
    - cron: "50 13 * * 1-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = taslak hazırlar, YAYINLAMAZ · publish = paylaşır"
        default: "test"
        type: choice
        options: [test, publish]
      date:
        description: "Tarih (YYYY-MM-DD). Boş bırakılırsa bugün."
        default: ""
        required: false
      hesap:
        description: "Hangi afişler: klein (haftalar/) · kastel · izaka · arti2 · hepsi"
        default: "klein"
        type: choice
        options: [klein, kastel, izaka, arti2, hepsi]

permissions:
  contents: write

concurrency:
  group: klein-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dünkü story istatistiklerini kaydet
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SAVE: ${{ (github.event_name == 'schedule' || inputs.mode == 'publish') && '1' || '0' }}
        run: python3 scripts/collect_insights.py
      - name: Story paylaş
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          DATE: ${{ inputs.date }}
          SCHED: ${{ github.event.schedule }}
          HESAP: ${{ inputs.hesap }}
        run: |
          case "$SCHED" in
            "50 9 * * 1-6")  BASE=kastel/haftalar ;;
            "50 11 * * 1-6") BASE=izaka/haftalar ;;
            "50 13 * * 1-6") BASE=arti2/haftalar ;;
            "50 7 * * *")    BASE=haftalar ;;
            *) case "$HESAP" in
                 kastel) BASE=kastel/haftalar ;;
                 izaka)  BASE=izaka/haftalar ;;
                 arti2)  BASE=arti2/haftalar ;;
                 hepsi)  BASE=haftalar,kastel/haftalar,izaka/haftalar,arti2/haftalar ;;
                 *)      BASE=haftalar ;;
               esac ;;
          esac
          export BASE
          python3 scripts/post_story.py
      - name: Paylaşım kaydını kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain haftalar kastel/haftalar izaka/haftalar arti2/haftalar performans.csv)" ]; then
            git config user.name "klein-story-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add haftalar kastel/haftalar izaka/haftalar arti2/haftalar
            [ -f performans.csv ] && git add performans.csv
            git commit -m "Story paylaşım kaydı $(date -u +%F)"
            git pull --rebase --autostash || true
            git push
          fi
